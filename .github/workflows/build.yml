name: Build dbquery.exe

on:
  push:
    branches: ["main", "master"]
    tags:     ["v*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...

  # ── Build native binaries ────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os:     windows
            goos:   windows
            goarch: amd64
            binary: dbquery.exe
          - os:     linux
            goos:   linux
            goarch: amd64
            binary: dbquery-linux-amd64
          - os:     macos
            goos:   darwin
            goarch: amd64
            binary: dbquery-macos-amd64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.binary }}
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" \
            -o ${{ matrix.binary }} \
            ./cmd/dbquery

      - name: Upload ${{ matrix.binary }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 30

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dbquery.exe/dbquery.exe
            dbquery-linux-amd64/dbquery-linux-amd64
            dbquery-macos-amd64/dbquery-macos-amd64
