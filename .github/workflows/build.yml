name: Build dbquery binaries

on:
  push:
    branches: ["main", "master"]
    tags:     ["v*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── Java fat-JAR (mssql-jdbc 13.4.0.jre11) ──────────────────────────────────
  build-jar:
    name: Build dbquery.jar (Java / mssql-jdbc)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build & test
        run: mvn clean package

      - name: Upload dbquery.jar
        uses: actions/upload-artifact@v4
        with:
          name: dbquery-jar
          path: |
            target/dbquery.jar
            dbquery.sh
            dbquery.bat
          retention-days: 30

  # ── Go-based binaries (multi-platform) ──────────────────────────────────────
  build-go:
    name: Build Go binary (${{ matrix.os }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os:     linux
            goos:   linux
            goarch: amd64
            ext:    ""
          - os:     windows
            goos:   windows
            goarch: amd64
            ext:    ".exe"
          - os:     macos
            goos:   darwin
            goarch: amd64
            ext:    ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build dbquery (Go)
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" \
            -o dbquery-go-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/dbquery

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbquery-go-${{ matrix.os }}-${{ matrix.goarch }}
          path: dbquery-go-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 30

  # ── Release: attach all artifacts to the GitHub Release ─────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-jar, build-go]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dbquery-jar/target/dbquery.jar
            dbquery-jar/dbquery.sh
            dbquery-jar/dbquery.bat
            dbquery-go-linux-amd64/dbquery-go-linux-amd64
            dbquery-go-windows-amd64/dbquery-go-windows-amd64.exe
            dbquery-go-macos-amd64/dbquery-go-macos-amd64

